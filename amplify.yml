version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify's environment variables and secrets exist only during the build. Next.js
        # reads .env.production at runtime too, so server code (MongoDB) can see them.
        # Environment variables come as MONGODB_*; secrets come as one JSON string in $secrets.
        - env | grep -E '^MONGODB_' >> .env.production || true
        - >-
          node -e 'const s = JSON.parse(process.env.secrets || "{}");
          for (const [k, v] of Object.entries(s)) if (k.startsWith("MONGODB_")) console.log(k + "=" + v)'
          >> .env.production
        # Fail here rather than deploy a site that cannot reach the database.
        - grep -q '^MONGODB_URI=' .env.production && grep -q '^MONGODB_DB=' .env.production || (echo "MONGODB_URI / MONGODB_DB missing from Amplify environment variables and secrets" && exit 1)
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
